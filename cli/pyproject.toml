[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-cli"
version = "0.1.0"
description = "Aegis CLI — regression gate and workflow helpers for CI."
requires-python = ">=3.11"
dependencies = []  # stdlib only (urllib) — keep install cheap for CI images

[project.scripts]
aegis = "aegis_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
